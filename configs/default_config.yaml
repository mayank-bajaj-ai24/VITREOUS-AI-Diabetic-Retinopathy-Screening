# ═══════════════════════════════════════════════════════
# NETRA — Default Configuration
# ═══════════════════════════════════════════════════════
# All thresholds and parameters are tunable.
# Quality Gate reads these at runtime.
# ═══════════════════════════════════════════════════════

# ─── Quality Gate Thresholds (Phase 1) ───
quality_gate:
  blur:
    laplacian_variance_min: 3.0       # Below this → FAIL_BLUR (Adjusted for typical fundus)
    tenengrad_min: 10.0               # Secondary sharpness check
    weight_laplacian: 0.7             # Blend weight for combined score
    weight_tenengrad: 0.3

  exposure:
    brightness_min: 40                # Below this → FAIL_UNDEREXPOSED (0-255 scale)
    brightness_max: 220               # Above this → FAIL_OVEREXPOSED
    histogram_uniformity_min: 0.3     # Minimum histogram spread

  fov:
    surround_threshold: 10            # Grayscale level separating black surround from retina
    coverage_min: 0.60                # Minimum fraction of frame covered by retina
    centering_max_offset: 0.15        # Max centroid offset from center (fraction of image)
    # coverage_min was 0.70, which rejected 79 of 81 IDRiD images. Measured
    # aperture coverage: IDRiD 0.690-0.796, APTOS samples 0.746-0.833, and a
    # deliberately cut-off capture 0.173. 0.60 clears every legitimate capture
    # and still separates them from a genuine framing failure by a wide margin.

# ─── Enhancement Parameters (Phase 2) ───
enhancement:
  target_size: 512                    # Output: 512×512
  normalization_mode: "float01"       # "float01" (0.0–1.0) or "uint8" (0–255)
  clahe_mode: "green"                 # "green" (vascular contrast) or "lab" (color-preserving)
  crop_margin_pct: 0.02               # Safety margin around ROI bounding box (fraction)

  # Quality-Adaptive Profiles
  profiles:
    low:                              # Good quality images — minimal enhancement
      clahe_clip_limit: 1.5
      clahe_tile_grid: 8
      nlm_filter_strength: 5
      nlm_template_window: 7
      nlm_search_window: 21

    medium:                           # Borderline images — moderate enhancement
      clahe_clip_limit: 2.5
      clahe_tile_grid: 8
      nlm_filter_strength: 8
      nlm_template_window: 7
      nlm_search_window: 21

    high:                             # Near-threshold images — aggressive enhancement
      clahe_clip_limit: 4.0
      clahe_tile_grid: 8
      nlm_filter_strength: 12
      nlm_template_window: 7
      nlm_search_window: 21

  # Profile selection thresholds (based on quality gate scores)
  profile_selection:
    high_threshold: 0.5               # Below this quality score → high enhancement
    medium_threshold: 0.7             # Below this → medium enhancement
    # Above medium_threshold → low enhancement

# ─── Segmentation (Phase 3) ───
# The segmentation track runs at a larger canvas than the grading track.
# A microaneurysm is roughly 20-30 px across in a native fundus capture; at the
# 512 grading canvas that shrinks to about 4 px, which no encoder-decoder can
# recover after its first pooling stage. Segmentation therefore standardises to
# 1024 and is fed to the network as overlapping 512 tiles.
segmentation:
  input_size: 1024                    # Canvas for the segmentation track
  tile_size: 512                      # Patch actually fed to UNet++
  tile_overlap: 128                   # Overlap between adjacent tiles
  num_classes: 5                      # background + MA + HE + EX + SE

  # Vessel extraction. Calibres are fractions of field-of-view diameter, not
  # pixels, so the same values hold at 512 and at 1024.
  vessels:
    calibre_min_pct: 0.0025           # Fine arterioles
    calibre_max_pct: 0.0140           # Major arcade veins
    num_scales: 6                     # Frangi scales across that range
    structure_sensitivity: 0.25       # Fraction of max response
    seed_percentile: 98.5             # Hysteresis: confident vessel seeds
    grow_percentile: 92.0             # Hysteresis: weak continuation
    min_object_area_pct: 2.0e-5       # Speckle removal, fraction of canvas
    fov_erode_pct: 0.015              # Keeps Frangi off the aperture rim

  # Optic disc and fovea localisation.
  optic_disc:
    radius_min_pct: 0.050             # Disc radius as fraction of FOV diameter
    radius_max_pct: 0.120
    disc_diameter_pct: 0.143          # Typical disc diameter (~1/7 of fundus)
    hough_sensitivity: 0.95
    refine_percentile: 90             # Boundary threshold within local ROI
    exclusion_margin: 1.30            # Exudate false-positive exclusion zone
    fovea_distance_dd: 2.5            # Fovea offset in disc diameters
    fovea_band_dd: 1.0                # Tolerance on that distance
    vessel_weight: 0.35               # Weight of vessel convergence cue
    fovea_vessel_weight: 0.45         # Weight of the avascular-zone cue
    fovea_prior_weight: 0.25          # Weight of the distance prior

# ─── Model Architecture (Phase 3) ───
models:
  segmentation:
    backbone: "unetpp"                # Nested UNet++ built via layerGraph
    num_classes: 5                    # background + MA + HE + EX + SE
    input_size: 512                   # Tile size; canvas is segmentation.input_size

  grading:
    efficientnet_features: 1792       # EfficientNet-B4 output dim
    resnet_features: 2048             # ResNet-50 output dim
    fused_features: 3840              # Concatenated
    dense1_units: 512
    dense1_dropout: 0.5
    dense2_units: 128
    dense2_dropout: 0.3
    num_classes: 5                    # ICDR Levels 0–4

# ─── Training (Phase 3) ───
training:
  batch_size: 16
  learning_rate: 0.0001
  epochs: 50
  patience: 10                        # Early stopping patience
  split_ratio: [0.70, 0.15, 0.15]    # Train / Val / Test

# ─── Dataset Paths ───
datasets:
  aptos: "data/datasets/aptos/"
  idrid: "data/datasets/idrid/"
  fgadr: "data/datasets/fgadr/"
  ddr: "data/datasets/ddr/"
  eyepacs: "data/datasets/eyepacs/"
  messidor2: "data/datasets/messidor2/"

# ─── Calibration (Phase 3 — XAI) ───
calibration:
  initial_temperature: 1.5            # Temperature scaling starting point
  max_iterations: 100                 # Optimization iterations

# ─── Target Metrics ───
targets:
  qwk: 0.88
  sensitivity: 0.90
  workload_reduction: 0.80
  screening_time_seconds: 120

# ─── Logging ───
logging:
  level: "INFO"
  log_dir: "logs/"
  save_quality_results: true
  save_enhancement_metadata: true
